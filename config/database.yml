
default: &default
  adapter: mysql2
  encoding: utf8mb4
  username: root
  password:
  host: 127.0.0.1
  port: 3306
  ssl_mode: disabled
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: Tareas

test:
  <<: *default
  database: Tareas_test

production:
  primary:
    <<: *default
    database: Tareas
  cache:
    <<: *default
    database: Tareas_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: Tareas_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: Tareas_cable
    migrations_paths: db/cable_migrate
